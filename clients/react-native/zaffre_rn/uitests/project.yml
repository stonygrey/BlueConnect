#
# xcodegen manifest for the hardware UI test of the React Native app. The
# test bundle has no host application of its own: it launches the installed
# app by bundle identifier (`XCUIApplication(bundleIdentifier:)`), because
# the app's Xcode project is generated by `expo prebuild` and edited by
# nothing else. `uitests/run` generates this project, passes the team from
# ../signing.local.json, and runs the test on the phone.
name: ZaffreReactUITests
options:
  bundleIdPrefix: com.stonygrey
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGN_STYLE: Automatic
targets:
  ZaffreReactUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - Tests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.stonygrey.zaffre.react.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  ZaffreReactUITests:
    build:
      targets:
        ZaffreReactUITests: [test]
    test:
      config: Debug
      targets:
        - ZaffreReactUITests
