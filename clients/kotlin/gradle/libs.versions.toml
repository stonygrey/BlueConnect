#
# Every version is pinned exactly. Gradle 8.14.3, AGP 8.13.2, and Kotlin 2.4.20
# are the torann pins, proven on this machine; the Compose BOM is the newest one whose Compose libraries (1.11.4) accept AGP 8.x; 1.12 needs AGP 9.1. activity-compose,
# protobuf, and coroutines versions are the current releases on 2026-10-04.

[versions]
kotlin = "2.4.20"
agp = "8.13.2"
torann = "0.3.1"
protobuf = "4.36.2"
coroutines = "1.11.0"
compose-bom = "2026.06.01"
activity-compose = "1.13.0"
security-crypto = "1.1.0"
code-scanner = "16.1.0"
junit = "4.13.2"
androidx-test-runner = "1.7.0"
androidx-test-ext-junit = "1.3.0"
# Compose ui-test-junit4 pulls in an Espresso that cannot inject input on Android 16; 3.7.0 can.
espresso-core = "3.7.0"

[libraries]
torann = { module = "com.stonygrey:torann", version.ref = "torann" }
protobuf-kotlin-lite = { module = "com.google.protobuf:protobuf-kotlin-lite", version.ref = "protobuf" }
coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-material-icons-core = { module = "androidx.compose.material:material-icons-core" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }
activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity-compose" }
security-crypto = { module = "androidx.security:security-crypto", version.ref = "security-crypto" }
code-scanner = { module = "com.google.android.gms:play-services-code-scanner", version.ref = "code-scanner" }
junit = { module = "junit:junit", version.ref = "junit" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidx-test-runner" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidx-test-ext-junit" }
espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "espresso-core" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
android-application = { id = "com.android.application", version.ref = "agp" }
