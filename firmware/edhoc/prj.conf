# Forked from NCS peripheral_uart prj.conf; Verdigris/EDHOC additions at the
# bottom.

# Enable the UART driver
CONFIG_UART_ASYNC_API=y
CONFIG_NRFX_UARTE=y
CONFIG_SERIAL=y

CONFIG_GPIO=y

# Make sure printk is printing to the UART console
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y

CONFIG_HEAP_MEM_POOL_SIZE=2048

CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="Nordic_UART_Service"
CONFIG_BT_MAX_CONN=1
CONFIG_BT_MAX_PAIRED=1


# Enable bonding + custom NVS (ek/*). Explicit so a reset cannot drop the
# handler backend.
CONFIG_BT_SETTINGS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y
CONFIG_FLASH=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_FLASH_MAP=y

# Enable DK LED and Buttons library
CONFIG_DK_LIBRARY=y

CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
# Config logger
CONFIG_LOG=y
CONFIG_USE_SEGGER_RTT=y
CONFIG_LOG_BACKEND_RTT=y
CONFIG_LOG_BACKEND_UART=n
CONFIG_LOG_PRINTK=n

CONFIG_ASSERT=y

# --- Verdigris additions ---

# Large ATT MTU + data length extension so multi-MTU frames move quickly.
CONFIG_BT_L2CAP_TX_MTU=247
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_CTLR_DATA_LENGTH_MAX=251

# Floating point math (sqrt) on doubles.
CONFIG_FPU=y

# Accept ATT long (queued) writes from centrals that exceed the MTU per write
# (iOS/Windows may segment large characteristic writes this way).
CONFIG_BT_ATT_PREPARE_COUNT=8

# Advertised name is generated at boot ("Verdigris NNNN").
CONFIG_BT_DEVICE_NAME_DYNAMIC=y

# EDHOC is the link security. Do not also run leftover NUS SMP pairing
# (it is not required by the GATT permissions and used the same buttons).
CONFIG_BT_NUS_SECURITY_ENABLED=n

# --- Link security (EDHOC RFC 9528, method 3, cipher suite 2, PSA crypto) ---
# P-256 ECDH, SHA-256, and AES-CCM-16-64-128 run in the Oberon software
# driver. HMAC covers both EDHOC_Extract and the hand-rolled HKDF-Expand
# (EDHOC_KDF), so no PSA HKDF symbol is needed.
CONFIG_PSA_CRYPTO=y
CONFIG_PSA_WANT_ALG_SHA_256=y
CONFIG_PSA_WANT_ALG_HMAC=y
CONFIG_PSA_WANT_KEY_TYPE_HMAC=y
CONFIG_PSA_WANT_ALG_ECDH=y
CONFIG_PSA_WANT_ECC_SECP_R1_256=y
CONFIG_PSA_WANT_KEY_TYPE_ECC_KEY_PAIR_IMPORT=y
CONFIG_PSA_WANT_KEY_TYPE_ECC_KEY_PAIR_GENERATE=y
CONFIG_PSA_WANT_KEY_TYPE_ECC_KEY_PAIR_EXPORT=y
CONFIG_PSA_WANT_KEY_TYPE_ECC_PUBLIC_KEY=y
# EDHOC message_3 sealing: AES-CCM with the suite's 8-byte tag.
CONFIG_PSA_WANT_ALG_CCM=y
CONFIG_PSA_WANT_AES_KEY_SIZE_128=y
# Transport frames: AES-256-GCM, same discipline as the other links.
CONFIG_PSA_WANT_ALG_GCM=y
CONFIG_PSA_WANT_KEY_TYPE_AES=y
CONFIG_PSA_WANT_AES_KEY_SIZE_256=y
CONFIG_MBEDTLS_HEAP_SIZE=16384

# Serial shell (ek info/keygen/cred/set-peer/clear) on the J-Link VCOM port.
# Logs stay on RTT, so the shell owns the UART. The hex CCS argument needs a
# longer command buffer than the default.
CONFIG_SHELL=y
CONFIG_SHELL_CMD_BUFF_SIZE=512
# Headroom for long hex arguments (CCS / verifier). Note this alone does
# not survive an unpaced burst — the J-Link CDC-to-UART bridge drops
# characters upstream of the chip — so the host tool paces its writes;
# that pacing is the operative fix.
CONFIG_SHELL_BACKEND_SERIAL_RX_RING_BUFFER_SIZE=1024

# The x-only decompression path (ecdh_x) uses ocrypto directly. On nRF54L
# the PSA driver is CRACEN, which does not carry the ocrypto headers, so
# pull in the standalone Oberon library for it explicitly.
CONFIG_NRF_OBERON=y
