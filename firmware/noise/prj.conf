# Forked from NCS peripheral_uart prj.conf; Verdigris additions at the bottom.

# Enable the UART driver
CONFIG_UART_ASYNC_API=y
CONFIG_NRFX_UARTE=y
CONFIG_SERIAL=y

CONFIG_GPIO=y

# Make sure printk is printing to the UART console
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y

CONFIG_HEAP_MEM_POOL_SIZE=2048

CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="Nordic_UART_Service"
CONFIG_BT_MAX_CONN=1
CONFIG_BT_MAX_PAIRED=1


# Enable bonding + custom NVS (vg/sk, vg/pin_*). Explicit so a reset
# cannot drop the handler backend.
CONFIG_BT_SETTINGS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y
CONFIG_FLASH=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_FLASH_MAP=y

# Enable DK LED and Buttons library
CONFIG_DK_LIBRARY=y

CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
# Config logger
CONFIG_LOG=y
CONFIG_USE_SEGGER_RTT=y
CONFIG_LOG_BACKEND_RTT=y
CONFIG_LOG_BACKEND_UART=n
CONFIG_LOG_PRINTK=n

CONFIG_ASSERT=y

# --- Verdigris additions ---

# Large ATT MTU + data length extension so multi-MTU frames move quickly.
CONFIG_BT_L2CAP_TX_MTU=247
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_CTLR_DATA_LENGTH_MAX=251

# Floating point math (sqrt) on doubles.
CONFIG_FPU=y

# Accept ATT long (queued) writes from centrals that exceed the MTU per write
# (iOS/Windows may segment large characteristic writes this way).
CONFIG_BT_ATT_PREPARE_COUNT=8

# Advertised name is generated at boot ("Verdigris NNNN").
CONFIG_BT_DEVICE_NAME_DYNAMIC=y

# Noise is the link security. Do not also run leftover NUS SMP pairing
# (it is not required by the GATT permissions and used the same buttons).
CONFIG_BT_NUS_SECURITY_ENABLED=n

# --- Link security (Noise_XX_25519_AESGCM_SHA256 on PSA crypto) ---
CONFIG_PSA_CRYPTO=y
CONFIG_PSA_WANT_ALG_ECDH=y
CONFIG_PSA_WANT_ECC_MONTGOMERY_255=y
CONFIG_PSA_WANT_KEY_TYPE_ECC_KEY_PAIR_IMPORT=y
CONFIG_PSA_WANT_KEY_TYPE_ECC_KEY_PAIR_GENERATE=y
CONFIG_PSA_WANT_KEY_TYPE_ECC_KEY_PAIR_EXPORT=y
CONFIG_PSA_WANT_KEY_TYPE_ECC_PUBLIC_KEY=y
# Ed25519 verify for optional client endorsement (Oberon software).
CONFIG_PSA_WANT_ALG_PURE_EDDSA=y
CONFIG_PSA_WANT_ECC_TWISTED_EDWARDS_255=y
CONFIG_PSA_WANT_ALG_SHA_256=y
CONFIG_PSA_WANT_ALG_HMAC=y
CONFIG_PSA_WANT_ALG_GCM=y
CONFIG_PSA_WANT_KEY_TYPE_AES=y
CONFIG_PSA_WANT_AES_KEY_SIZE_256=y
CONFIG_MBEDTLS_HEAP_SIZE=16384

# Serial shell (vg info/unpair/confirm) on the J-Link VCOM port. Logs stay
# on RTT, so the shell owns the UART.
CONFIG_SHELL=y
